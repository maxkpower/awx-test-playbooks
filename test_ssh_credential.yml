---
# Bitwarden Credential Resolution Test
#
# IMPORTANT: AWX does NOT set ansible_password as a variable for Machine credentials.
# SSH passwords are injected via pexpect (--ask-pass), not as Ansible variables.
#
# SUCCESS CRITERIA: If this play starts, the Bitwarden credential was resolved successfully.
# If credential resolution failed, the job would fail pre-start with:
# "Credential does not provide one or more required fields"

- name: E2E Test - Bitwarden Credential Resolution
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Verify play started (proves credential resolution succeeded)
      debug:
        msg: |
          ✓ SUCCESS: Play execution started

          This proves the Bitwarden plugin successfully:
          1. Was invoked by AWX to resolve the credential
          2. Retrieved the secret from Bitwarden Secrets Manager
          3. Returned the value to AWX
          4. Passed AWX's credential validation

          The credential is injected via pexpect (--ask-pass mechanism),
          not as an ansible_password variable. This is standard AWX behavior
          for ALL Machine credentials, regardless of source.

    - name: Set test result
      set_fact:
        credential_test_result: "PASSED"
        credential_source: "Bitwarden Secrets Manager"

    - name: Report test success
      debug:
        msg: "✓ Bitwarden credential resolution test: {{ credential_test_result }}"
