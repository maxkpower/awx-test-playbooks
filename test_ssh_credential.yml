---
- name: E2E Test - SSH Credential Injection
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Verify ansible_password is defined
      assert:
        that:
          - ansible_password is defined
          - ansible_password | length > 0
        fail_msg: "SSH password was not injected from Bitwarden"
        success_msg: "Credential injection successful"

    - name: Display credential length (safe)
      debug:
        msg: "Password length: {{ ansible_password | length }} characters"

    - name: Generate credential checksum for verification
      debug:
        msg: "Credential checksum: {{ ansible_password | hash('sha256') }}"
      # This allows rotation test to verify new secret was used
      # without leaking the actual value

    - name: Final status
      debug:
        msg: "✓ E2E Test Passed: Credential injection successful"
