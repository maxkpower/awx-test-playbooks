---
# Bitwarden Credential Resolution Test (API Token)
#
# IMPORTANT: AWX does NOT set ansible_password as a variable for Machine credentials.
# This test uses a Machine credential with password field mapped to Bitwarden.
#
# SUCCESS CRITERIA: If this play starts, the Bitwarden credential was resolved successfully.

- name: E2E Test - Bitwarden Credential Resolution (API Token)
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Verify play started (proves credential resolution succeeded)
      debug:
        msg: |
          ✓ SUCCESS: Play execution started

          This proves the Bitwarden plugin successfully resolved the API token
          from Bitwarden Secrets Manager. The credential passed AWX validation
          and the job was allowed to start.

    - name: Set test result
      set_fact:
        credential_test_result: "PASSED"
        credential_type: "API Token"
        credential_source: "Bitwarden Secrets Manager"

    - name: Report test success
      debug:
        msg: "✓ Bitwarden {{ credential_type }} credential resolution test: {{ credential_test_result }}"
