---
- name: E2E Test - API Token Credential Injection
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Verify ansible_password is defined (used for API token)
      assert:
        that:
          - ansible_password is defined
          - ansible_password | length > 0
        fail_msg: "API token was not injected from Bitwarden"
        success_msg: "API token injection successful"

    - name: Display token length (safe)
      debug:
        msg: "Token length: {{ ansible_password | length }} characters"

    - name: Simulate API call with token
      debug:
        msg: "Would call API with token (length={{ ansible_password | length }})"

    - name: Final status
      debug:
        msg: "✓ E2E Test Passed: API token injection successful"
