---
# Demo: Bitwarden Secret Injection
#
# This playbook demonstrates that AWX resolves credentials from
# Bitwarden Secrets Manager at job launch time. If this play starts,
# the credential was successfully retrieved from Bitwarden.
#
# USE CASE: SSH Machine credential with password sourced from Bitwarden.

- name: "Demo - Bitwarden Secret Injection"
  hosts: localhost
  connection: local
  gather_facts: yes

  tasks:
    - name: "Step 1: Confirm credential was resolved by Bitwarden"
      debug:
        msg: |
          =====================================================
           Bitwarden Secrets Manager - Credential Resolved
          =====================================================

          This job started successfully, which proves:

            1. AWX invoked the Bitwarden Secrets Manager plugin
            2. The plugin authenticated to Bitwarden
            3. The secret was retrieved by UUID
            4. AWX injected the credential into this job

          Credential source:  Bitwarden Secrets Manager
          Hostname:           {{ ansible_hostname }}
          Date:               {{ ansible_date_time.iso8601 }}

          =====================================================

    - name: "Step 2: Simulate using the credential (e.g. SSH login)"
      debug:
        msg: >
          In a real scenario, AWX would use this credential to SSH
          into a target host. The password was injected via pexpect
          (--ask-pass) — it is never exposed as an Ansible variable.

    - name: "Step 3: Demonstrate no secret leakage"
      debug:
        msg: |
          Security check:
            - The secret value does NOT appear in job stdout
            - The secret value is NOT available as a variable
            - AWX redacts credential values from all logs

          This is a core security feature of AWX external credentials.

    - name: "Result: SUCCESS"
      debug:
        msg: "Bitwarden secret injection demo completed successfully."
